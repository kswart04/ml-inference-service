[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ml-inference-service"
version = "0.1.0"
description = "Educational inference service with an incrementally built batching scheduler"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "prometheus-client>=0.21,<1",
    "starlette>=0.40,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
hf = [
    "huggingface-hub>=0.34,<2",
    "torch>=2.7,<3",
    "transformers>=5,<6",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not model'"
markers = [
    "model: explicit tests requiring prepared downloaded model artifacts",
    "realtime: smoke tests that use real clocks with generous bounds",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
