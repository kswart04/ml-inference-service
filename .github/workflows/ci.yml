name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
  types-and-custom:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.10'
      - run: uv sync --locked --extra hf --extra custom --extra benchmark
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python -m training.data
      - run: uv run --no-sync python -m training.train
      - run: uv run --no-sync pytest -m model tests/test_custom_adapter.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t inference-service:test .
      - name: Exercise CPU container
        run: |
          docker run -d --name inference-smoke -p 127.0.0.1:8000:8000 inference-service:test
          trap 'docker logs inference-smoke; docker rm -f inference-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health/ready
          curl --fail http://127.0.0.1:8000/v1/predict \
            -H 'Content-Type: application/json' \
            -d '{"model_id":"fake-sentiment","model_version":"v1","input":{"text":"Excellent"}}' \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["prediction"]["label"] == "positive"'
